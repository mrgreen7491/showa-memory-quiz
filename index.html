<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>デイサービス テレビクイズ</title>
<style>
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    background-color: #f0f8ff;
    text-align: center;
    margin: 0;
    padding: 20px;
  }
  #start-btn {
    font-size: 32px;
    padding: 20px 50px;
    margin-top: 150px;
    background-color: #ff6b6b;
    color: white;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    box-shadow: 0 6px 0 #d94848;
  }
  #greeting-area {
    display: none;
    max-width: 900px;
    margin: 0 auto;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  }
  #chara-img {
    width: 320px;
    height: auto;
    border-radius: 15px;
    animation: sway 2.5s infinite ease-in-out;
  }
  @keyframes sway {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-5px); }
  }
  #subtitle-box {
    font-size: 28px;
    line-height: 1.6;
    font-weight: bold;
    color: #333;
    background-color: #fff9db;
    border: 3px solid #fcc419;
    border-radius: 15px;
    padding: 20px;
    margin-top: 20px;
    text-align: left;
  }
  #skip-btn {
    margin-top: 20px;
    font-size: 18px;
    padding: 10px 25px;
    background-color: #adb5bd;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }

/* ===== テレビ表示（横長の画面で1画面に収める）※2026-11-25追加 ===== */
@media (min-width: 900px) and (min-aspect-ratio: 5/4) {
  body { height: 100vh; box-sizing: border-box; padding: 1.5vh 2vw; overflow-y: auto; display: flex; flex-direction: column; justify-content: center; }
  #start-screen h1 { font-size: 6vh; margin: 0 0 2vh; }
  #start-btn { font-size: 4.5vh; padding: 2.4vh 5vw; margin-top: 4vh; border-radius: 2vh; }
  #greeting-area { max-width: none; width: 94vw; margin: 0 auto; padding: 1.8vh 2vw; border-radius: 2vh; }
  #chara-img { width: auto; height: 30vh; max-width: 100%; border-radius: 2vh; }
  #subtitle-box { font-size: 3vh; line-height: 1.5; padding: 1.6vh 2vw; margin-top: 1.4vh; border-radius: 2vh; }
  #skip-btn { margin-top: 1.4vh; font-size: 2.2vh; padding: 1vh 2vw; border-radius: 1vh; }
}
</style>
</head>
<body>

  <!-- ① 最初の待機画面 -->
  <div id="start-screen">
    <h1>📺 今日のテレビクイズ</h1>
    <button id="start-btn">クイズを始める</button>
  </div>

  <!-- ② 司会者の挨拶アニメーション画面 -->
  <div id="greeting-area">
    <img id="chara-img" src="chara_close.png" alt="司会者">
    <div id="subtitle-box">
      デイサービスなぎさにお通いのみなさん、こんにちは。<br>
      お元気でお過ごしですか？<br>
      私は今日のテレビクイズの声を担当している、あいだしげるです。<br>
      今日、みなさんにテレビでお出しするクイズはそんなに難しくありません。<br>
      もし分からなくても、まわりの皆さんと相談して答えを出して下さい。<br>
      あせらないで、ゆっくり考えてくださいね。<br>
      楽しみながらやりましょう。<br>
      さあ、それでは始めましょう！
    </div>
    <button id="skip-btn">挨拶をスキップしてクイズへ ➔</button>
  </div>

  <audio id="greeting-audio" src="greeting.wav"></audio>

<script>
  const startScreen = document.getElementById('start-screen');
  const startBtn = document.getElementById('start-btn');
  const greetingArea = document.getElementById('greeting-area');
    const charaImg = document.getElementById('chara-img');
  const audio = document.getElementById('greeting-audio');
  const skipBtn = document.getElementById('skip-btn');

  let audioCtx, analyser, source;
  let lipSyncTimer, blinkTimer, blinkResetTimer;
  let isBlinking = false;
  let animating = false;   // 口パク・まばたきを動かしている間だけ true

  // 口の開き具合のしきい値（console.log の値を見て調整できます）
  // greeting.wav を解析して決めた値（声が大きい音声のため、高めに設定）
  const THRESHOLD_OPEN = 160;
  const THRESHOLD_HALF = 80;
  const DEBUG_LOG = false;  // true にすると音量の値をコンソールに表示

  // 画像の事前読み込み（切り替え時のチラつき防止）
  const images = ['chara_close.png', 'chara_half.png', 'chara_open.png', 'chara_blink.png'];
  const missing = [];
  images.forEach(src => {
    const img = new Image();
    img.onerror = () => {
      missing.push(src);
      let box = document.getElementById('missing-box');
      if (!box) {
        box = document.createElement('div');
        box.id = 'missing-box';
        box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;background:#c92a2a;color:#fff;padding:12px;font-size:18px;z-index:9999;text-align:left;';
        document.body.appendChild(box);
      }
      box.textContent = '画像が見つかりません: ' + missing.join('、') +
        '（public フォルダの場所とファイル名を確認してください）';
    };
    img.src = src;
  });

  startBtn.addEventListener('click', () => {
    startScreen.style.display = 'none';
    greetingArea.style.display = 'block';

    // 口パク用の音量解析は、インターネット上（https）では使えますが、
    // パソコンの中のファイルを直接開いた場合（file://）は、ブラウザの安全上の決まりで
    // 音が消えてしまいます。そのため、file:// のときは解析を使わず、音をそのまま鳴らします。
    if (!audioCtx && /^https?:$/.test(location.protocol)) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.3;  // 反応を速くする
        source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
      } catch (e) {
        audioCtx = null; analyser = null;  // 解析できなくても、音は鳴らす
      }
    }

    // ブラウザが音声エンジンを止めている場合に再開する
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

    // 再生に失敗しても、スキップボタンは使えるようにする
    audio.play().catch((e) => { console.warn("再生できませんでした:", e); });

    startAnimations();
  });

  function startAnimations() {
    animating = true;

    // 1. 3段階口パク処理（0.09秒ごとに音量チェック）
    const dataArray = analyser ? new Uint8Array(analyser.frequencyBinCount) : null;
    const N = 30;  // 人の声の帯域（約0〜5kHz）だけを見る
    lipSyncTimer = setInterval(() => {
      if (isBlinking) return; // まばたき中は目を閉じた画像を優先

      // 解析が使えないとき（file:// で開いた確認用）は、音が鳴っている間、口を適当に動かす
      if (!analyser) {
        if (!audio.paused && !audio.ended) {
          const r = Math.random();
          charaImg.src = r > 0.66 ? 'chara_open.png' : (r > 0.33 ? 'chara_half.png' : 'chara_close.png');
        } else {
          charaImg.src = 'chara_close.png';
        }
        return;
      }

      analyser.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i = 0; i < N; i++) sum += dataArray[i];
      const average = sum / N;
      if (DEBUG_LOG) console.log(average.toFixed(1));

      if (average > THRESHOLD_OPEN) {
        charaImg.src = 'chara_open.png';  // 大きな声：全開
      } else if (average > THRESHOLD_HALF) {
        charaImg.src = 'chara_half.png';  // 小さな声：半開き
      } else {
        charaImg.src = 'chara_close.png'; // 無音：閉じ
      }
    }, 90);

    // 2. ランダムなまばたき処理（3〜5秒ごとに一瞬目を閉じる）
    function scheduleBlink() {
      if (!animating) return;
      const nextBlink = Math.random() * 2000 + 3000;
      blinkTimer = setTimeout(() => {
        if (!animating) return;
        if (!audio.paused && !audio.ended) {
          isBlinking = true;
          charaImg.src = 'chara_blink.png';
          blinkResetTimer = setTimeout(() => {
            isBlinking = false;
            if (animating) charaImg.src = 'chara_close.png';
            scheduleBlink();
          }, 150); // 0.15秒だけ目を閉じる
        } else {
          scheduleBlink(); // 音声が止まっていても、次のまばたきを予約し続ける
        }
      }, nextBlink);
    }
    scheduleBlink();
  }

  function stopAnimations() {
    animating = false;
    isBlinking = false;
    clearInterval(lipSyncTimer);
    clearTimeout(blinkTimer);
    clearTimeout(blinkResetTimer);
  }

  function goToQuiz() {
    audio.pause();
    stopAnimations();
    window.location.href = 'quiz.html';  // クイズへ移動
  }

  audio.addEventListener('ended', () => {
    stopAnimations();
    charaImg.src = 'chara_close.png';
    setTimeout(goToQuiz, 1000);
  });

  skipBtn.addEventListener('click', goToQuiz);
</script>


<!-- 全画面ボタン（スタッフ用・共通部品 v1） -->
<style>
#btnFullscreen{position:fixed;top:1.2vh;right:1.2vw;z-index:9999;font-family:inherit;font-size:max(13px,2.4vh);line-height:1.2;padding:.7vh 1.3vw;border-radius:1.2vh;border:.3vh solid rgba(60,40,20,.35);background:rgba(255,255,255,.82);color:#4a3a2a;opacity:.8;cursor:pointer;box-shadow:none}
#btnFullscreen:hover,#btnFullscreen:focus-visible{opacity:1}
</style>
<button id="btnFullscreen" type="button" aria-label="全画面表示">⛶ 全画面</button>
<script>
(function(){
  var b=document.getElementById('btnFullscreen'), de=document.documentElement;
  var can=document.fullscreenEnabled||document.webkitFullscreenEnabled;
  if(!can){ b.style.display='none'; return; }
  function isFS(){ return document.fullscreenElement||document.webkitFullscreenElement; }
  function upd(){ b.textContent=isFS()?'✕ 全画面をやめる':'⛶ 全画面'; }
  b.addEventListener('click',function(e){
    e.stopPropagation();
    try{
      if(isFS()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
      else{ (de.requestFullscreen||de.webkitRequestFullscreen).call(de); }
    }catch(err){}
    b.blur();
  });
  document.addEventListener('fullscreenchange',upd);
  document.addEventListener('webkitfullscreenchange',upd);
  upd();
})();
</script>
</body>
</html>
